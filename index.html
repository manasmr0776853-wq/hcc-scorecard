<script>
let adminLoggedIn = false;

async function openAdmin() {
  const password = prompt("Enter Admin Password:");
  if (password === null) return;

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      alert("Login failed. Check your password.");
      return;
    }

    adminLoggedIn = true;
    showAdminEditor();
  } catch {
    alert("Login failed. Please try again.");
  }
}

async function showAdminEditor() {
  let players;

  try {
    const response = await fetch("/api/players", {
      credentials: "same-origin",
      cache: "no-store"
    });

    if (!response.ok) throw new Error();

    players = await response.json();
  } catch {
    alert("Could not load players.");
    return;
  }

  const old = document.getElementById("admin-editor");
  if (old) old.remove();

  const panel = document.createElement("div");
  panel.id = "admin-editor";
  panel.style.cssText =
    "position:fixed;inset:0;background:#f4f6f8;z-index:9999;" +
    "overflow:auto;padding:20px;font-family:Arial,sans-serif";

  panel.innerHTML = `
    <div style="max-width:500px;margin:auto;background:white;padding:20px;border-radius:14px">
      <h2>🏏 Admin Panel</h2>
      <p style="margin:12px 0">Select a player and update their statistics.</p>

      <label for="admin-player">Player</label>
      <select id="admin-player" style="width:100%;padding:12px;margin:8px 0 16px"></select>

      <div id="admin-fields"></div>

      <button id="save-stats" style="width:100%;padding:14px;background:#111827;color:white;border:0;border-radius:8px;margin-top:15px">
        Save Statistics
      </button>

      <button id="close-admin" style="width:100%;padding:14px;margin-top:10px">
        Close Admin Panel
      </button>

      <p id="admin-message" role="status" style="margin-top:12px"></p>
    </div>
  `;

  document.body.appendChild(panel);

  const select = panel.querySelector("#admin-player");
  const fields = panel.querySelector("#admin-fields");

  for (const player of players) {
    const option = document.createElement("option");
    option.value = player.id;
    option.textContent = player.name;
    select.appendChild(option);
  }

  const stats = [
    ["runs", "Runs"],
    ["batting_average", "Batting Average"],
    ["strike_rate", "Strike Rate"],
    ["wickets", "Wickets"],
    ["economy", "Economy"],
    ["bowling_average", "Bowling Average"]
  ];

  function renderFields() {
    const player = players.find(p => p.id === Number(select.value));

    fields.replaceChildren();

    for (const [key, label] of stats) {
      const wrapper = document.createElement("div");
      wrapper.style.marginBottom = "12px";

      const caption = document.createElement("label");
      caption.textContent = label;
      caption.htmlFor = "stat-" + key;

      const input = document.createElement("input");
      input.id = "stat-" + key;
      input.type = "number";
      input.min = "0";
      input.step = ["runs", "wickets"].includes(key) ? "1" : "any";
      input.value = player[key] ?? 0;
      input.style.cssText = "width:100%;padding:11px;margin-top:5px";

      wrapper.append(caption, input);
      fields.appendChild(wrapper);
    }
  }

  select.addEventListener("change", renderFields);
  renderFields();

  panel.querySelector("#save-stats").addEventListener("click", async () => {
    if (!adminLoggedIn) return;

    const button = panel.querySelector("#save-stats");
    const message = panel.querySelector("#admin-message");
    button.disabled = true;
    message.textContent = "Saving...";

    const payload = { id: Number(select.value) };

    for (const [key] of stats) {
      const input = panel.querySelector("#stat-" + key);
      const value = input.valueAsNumber;

      if (
        input.value.trim() === "" ||
        !Number.isFinite(value) ||
        value < 0 ||
        (["runs", "wickets"].includes(key) && !Number.isInteger(value))
      ) {
        message.textContent = "Please enter valid statistics.";
        button.disabled = false;
        return;
      }

      payload[key] = value;
    }

    try {
      const response = await fetch("/api/players", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        message.textContent = result.error || "Could not save statistics.";
        return;
      }

      message.textContent = "Statistics saved successfully!";
      await showAdminEditor();
    } catch {
      message.textContent = "Network error. Please try again.";
    } finally {
      button.disabled = false;
    }
  });

  panel.querySelector("#close-admin").addEventListener("click", async () => {
    try {
      await fetch("/api/logout", {
        method: "POST",
        credentials: "same-origin"
      });
    } finally {
      adminLoggedIn = false;
      panel.remove();
    }
  });
}
  </script>
